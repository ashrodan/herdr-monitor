# The Xcode project is generated, not committed:
#   brew install xcodegen && xcodegen generate && open HerdrMonitor.xcodeproj
name: HerdrMonitor
options:
  bundleIdPrefix: io.github.ashrodan
  deploymentTarget:
    iOS: "17.0"
packages:
  HerdrMonitor:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HerdrMonitor:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HerdrMonitor
        product: HerdrKit
      - package: HerdrMonitor
        product: HerdrUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Herdr
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The server is reached over Tailscale: https by name, or a tailnet address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ashrodan.herdrmonitor
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  HerdrMonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HerdrMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ashrodan.herdrmonitor.uitests
schemes:
  HerdrMonitor:
    build:
      targets:
        HerdrMonitor: all
        HerdrMonitorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [HerdrMonitorUITests]
